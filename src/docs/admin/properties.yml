List all properties with filters (admin only).
---
tags:
  - Admin
security:
  - Bearer: []
parameters:
  - in: query
    name: page
    required: false
    type: integer
    default: 1
  - in: query
    name: per_page
    required: false
    type: integer
    default: 20
  - in: query
    name: status
    required: false
    type: string
    description: approved, pending or all
  - in: query
    name: category
    required: false
    type: string
  - in: query
    name: search
    required: false
    type: string
responses:
  200:
    description: Paginated list of properties
  403:
    description: Insufficient permissions
