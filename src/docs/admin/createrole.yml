Create a new role.
---
tags:
  - Admin
security:
  - Bearer: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        name:
          type: string
          example: moderator
        description:
          type: string
          example: Can moderate listings
responses:
  201:
    description: Role created
  400:
    description: Name required or role exists
  403:
    description: Insufficient permissions
