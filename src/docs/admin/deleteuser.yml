Delete a user (admin only).
---
tags:
  - Admin
security:
  - Bearer: []
parameters:
  - in: path
    name: id
    required: true
    type: integer
    description: Id of the user
responses:
  204:
    description: User deleted
  400:
    description: Cannot delete own account
  403:
    description: Insufficient permissions
  404:
    description: User not found
