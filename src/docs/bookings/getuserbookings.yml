Get all bookings made by a user.
---
tags:
  - Bookings
parameters:
  - in: path
    name: user_id
    required: true
    type: integer
    description: Id of the customer
  - in: query
    name: page
    required: false
    type: integer
    default: 1
  - in: query
    name: per_page
    required: false
    type: integer
    default: 20
  - in: query
    name: status
    required: false
    type: string
    description: Filter by status (pending, confirmed, cancelled, completed)
responses:
  200:
    description: Paginated list of bookings
  400:
    description: Invalid status
