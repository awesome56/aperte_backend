Add a room to a hotel property.
---
tags:
  - Rooms
security:
  - Bearer: []
parameters:
  - in: path
    name: property_id
    required: true
    type: integer
    description: Id of the hotel property
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        room_type:
          type: string
          example: Standard
          description: Room type (Standard, Deluxe, Suite, etc.)
        beds:
          type: integer
          example: 2
          description: Number of beds in the room
        price:
          type: number
          example: 45000
          description: Price per night
        amenities:
          type: object
          example: {"wifi": true, "tv": true}
          description: Amenities in json format
        available:
          type: integer
          example: 1
          description: 0 or 1
responses:
  201:
    description: Room created
  400:
    description: Invalid data or property is not a hotel
  401:
    description: Unauthorized
  404:
    description: Property not found
