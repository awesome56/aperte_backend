Get a paginated list of all property requests belonging to a user.
---
tags:
  - Requests
parameters:
  - in: path
    name: id
    description: The ID of the user whose requests should be returned
    required: true
    type: integer
  - in: query
    name: page
    description: Page number
    required: false
    type: integer
    default: 1
  - in: query
    name: per_page
    description: Number of items per page
    required: false
    type: integer
    default: 20
responses:
  200:
    description: Paginated list of user requests
  404:
    description: User not found
