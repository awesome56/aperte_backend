Add one or more images to a property owned by the authenticated user.
---
tags:
  - Properties
security:
  - Bearer: []
parameters:
  - in: path
    name: id
    description: The ID of the property to attach the images to
    required: true
    type: integer
  - in: formData
    name: file
    description: One or more image files (jpg, jpeg, png, heif) not more than 16MB each
    required: true
    type: file
    collectionFormat: multi
    items:
      type: file
responses:
  201:
    description: Images added successfully
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 12
          image_url:
            type: string
            example: "/static/files/1/properties/1699300533000386_i.png"
          dp:
            type: integer
            example: 1
          created_at:
            type: string
            example: "2023-11-09T12:34:56.789Z"
          updated_at:
            type: string
            example: "2023-11-09T12:34:56.789Z"
  400:
    description: No file added or invalid file extension/size
  401:
    description: Property does not belong to the authenticated user
  404:
    description: Property not found
