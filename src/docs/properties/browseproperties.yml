Browse all property listings with optional filters.
---
tags:
  - Properties
parameters:
  - in: query
    name: page
    description: Page number
    required: false
    type: integer
    default: 1
  - in: query
    name: per_page
    description: Number of items per page
    required: false
    type: integer
    default: 20
  - in: query
    name: category
    description: Filter by category (property, land, hotel, hall, event_center, shortlet, other)
    required: false
    type: string
  - in: query
    name: purpose
    description: Filter by purpose (rent, sale, both)
    required: false
    type: string
  - in: query
    name: property_type
    description: Filter by property type (apartment, house, land, hotel, hall, event_center, shortlet, etc.)
    required: false
    type: string
  - in: query
    name: city
    description: Filter by city
    required: false
    type: string
  - in: query
    name: state
    description: Filter by state
    required: false
    type: string
  - in: query
    name: country
    description: Filter by country
    required: false
    type: string
  - in: query
    name: min_price
    description: Minimum price
    required: false
    type: number
  - in: query
    name: max_price
    description: Maximum price
    required: false
    type: number
responses:
  200:
    description: Paginated list of property listings
