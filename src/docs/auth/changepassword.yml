Change password for the authenticated user
---
tags:
  - Authentication
security:
  - bearerAuth: []
parameters:
  - name: body
    description: The body should contain the old password, the new password and the confirm password
    in: body
    required: true
    schema:
      type: object
      required:
        - "old_password"
        - "new_password"
      properties:
        old_password:
          type: "string"
          format: password
          example: "********"
        new_password:
          type: "string"
          format: password
          example: "********"
        comfirm_password:
          type: "string"
          format: password
          example: "********"
responses:
  200:
    description: Password change successful

  400:
    description: Password missmatch, weak password or wrong old password

  404:
    description: User not found
