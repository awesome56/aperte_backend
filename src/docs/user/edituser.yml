Edit the profile of the authenticated user.
---
tags:
  - User
security:
  - Bearer: []
parameters:
  - name: body
    description: The body should contain the details to update
    in: body
    required: true
    schema:
      type: object
      required:
        - full_name
      properties:
        full_name:
          type: string
          example: "John Doe"
responses:
  200:
    description: User successfully edited
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          example: "john@example.com"
        full_name:
          type: string
          example: "John Doe"
        phone_number:
          type: integer
          example: 2348123456789
        profile_picture:
          type: string
          example: "/static/files/1/1625155481234_profile.jpg"
        email_verified:
          type: integer
          example: 1
        phone_number_verified:
          type: integer
          example: 1
        created_at:
          type: string
          example: "2023-11-09T12:34:56.789Z"
        updated_at:
          type: string
          example: "2023-11-10T12:34:56.789Z"
  400:
    description: Fullname is required
  404:
    description: User not found
