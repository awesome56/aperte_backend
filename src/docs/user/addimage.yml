Add a profile picture for the authenticated user.
---
tags:
  - User
security:
  - Bearer: []
parameters:
  - in: formData
    name: dp
    description: The image file to use as profile picture (jpg, jpeg, png, heif) not more than 16MB
    required: true
    type: file
responses:
  201:
    description: Profile picture added successfully
    schema:
      type: object
      properties:
        profile_picture:
          type: string
          example: "/static/files/1/1625155481234_profile.jpg"
  400:
    description: File empty or invalid format
    schema:
      type: object
      properties:
        error:
          type: string
          example: "File empty or invalid format"
  404:
    description: User not found
    schema:
      type: object
      properties:
        message:
          type: string
          example: "User not found"
