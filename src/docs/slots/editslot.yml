Edit a slot.
---
tags:
  - Slots
security:
  - Bearer: []
parameters:
  - in: path
    name: id
    required: true
    type: integer
    description: Id of the slot
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        date:
          type: string
          format: date
          example: 2026-08-16
        start_time:
          type: string
          example: "10:00"
        end_time:
          type: string
          example: "18:00"
        price:
          type: number
          example: 200000
responses:
  200:
    description: Slot updated
  400:
    description: Invalid data
  401:
    description: Unauthorized
  404:
    description: Slot not found
  409:
    description: Slot is pending/booked or overlaps with another slot
